on: 
  push:
    branches: [main]
jobs: 
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    # Add "id-token" with the intended permissions.
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/234416231327/locations/global/workloadIdentityPools/github-actions/providers/notely-github'
          service_account: 'cloud-run-deployer@notely-504810.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'
      
      - name: set up go 
        uses: actions/setup-go@v6
        with: 
          go-version: "1.26.0"

      - name: Build production binary
        run: ./scripts/buildprod.sh

      - name: Build and push Docker image
        run: >-
          gcloud builds submit
          --tag us-central1-docker.pkg.dev/notely-504810/notely-ar-repo/notely:${{ github.sha }}
          .

      - name: Run database migrations
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy notely
          --image us-central1-docker.pkg.dev/notely-504810/notely-ar-repo/notely:${{ github.sha }}
          --region us-central1
          --allow-unauthenticated
          --project notely-504810
          --max-instances=4
