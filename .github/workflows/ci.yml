name: ci

on: 
  pull_request:
    branches: [main]

jobs:
  style: 
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

 
      - name: style check
        run: |
          go fmt ./...
          git diff --exit-code

  tests:  
    name: Tests
    runs-on: ubuntu-latest


    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      
      - name: Run unitTests
        run: go test  -cover ./...

      - name: Force Failure
        run: exit 0
