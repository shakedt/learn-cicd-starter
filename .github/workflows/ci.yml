name: ci

on: 
  pull_request:
    branches: [main]

jobs:
  style: 
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

 
      - name: style check
        run: test -z $(go fmt ./...)

      - name: Install staticcheck      
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: static check
        run: staticcheck ./...

  tests:  
    name: Tests
    runs-on: ubuntu-latest


    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      
      - name: Run unitTests
        run: go test  -cover ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: run gosec
        run: gosec ./...

      - name: Force Failure
        run: exit 0
